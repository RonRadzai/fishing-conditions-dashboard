<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.weather.gov https://api.waterdata.usgs.gov https://fonts.googleapis.com https://fonts.gstatic.com;"
    />
    <title>New River</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <svg class="svg-defs" width="0" height="0" aria-hidden="true"><defs>
      <radialGradient id="moon-lit" cx="36%" cy="32%" r="82%">
        <stop offset="0" stop-color="#fdf8e6" />
        <stop offset="62%" stop-color="#f2e3b4" />
        <stop offset="100%" stop-color="#d9c48d" />
      </radialGradient>
      <radialGradient id="moon-dark" cx="42%" cy="36%" r="80%">
        <stop offset="0" stop-color="#26314e" />
        <stop offset="100%" stop-color="#151d31" />
      </radialGradient>
      <clipPath id="moon-disc"><circle cx="20" cy="20" r="18" /></clipPath>
      <filter id="moon-soft" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="0.9" />
      </filter>
    </defs></svg>
    <div class="bg-orb bg-orb-left"></div>
    <div class="bg-orb bg-orb-right"></div>
    <main class="layout">
      <header class="hero">
        <div class="hero-text">
          <h1><img src="./assets/favicon.svg" class="site-logo" alt="" aria-hidden="true" />New River</h1>
          <p id="location-summary" class="subtitle">Below Claytor Dam</p>
        </div>
        <label class="ramp-picker">
          <span class="ramp-picker-label">Access point</span>
          <select id="location-select" class="ramp-select"></select>
        </label>
      </header>

      <section class="card quick-view" aria-labelledby="qv-title">
        <div class="card-title-row">
          <h2 id="qv-title">Conditions at a Glance</h2>
          <p id="qv-date" class="card-meta"></p>
        </div>
        <div id="qv-content" class="qv-content"></div>
      </section>

      <section class="grid">
        <article class="card" id="weather-card">
          <div class="card-title-row">
            <h2>Weather</h2>
            <p id="weather-meta" class="card-meta">Now + 8h</p>
          </div>
          <p id="weather-updated" class="card-meta"></p>
          <div id="weather-content" class="content-block"></div>
        </article>

        <article class="card" id="aep-card">
          <div class="card-title-row">
            <h2>Flow</h2>
          </div>
          <p id="aep-updated" class="card-meta"></p>
          <div id="aep-content" class="content-block"></div>
          <div class="usgs-section" id="nearest-gauge-section" hidden>
            <p class="section-label" id="nearest-gauge-label">Nearest Gauge</p>
            <div id="nearest-gauge-content" class="content-block"></div>
          </div>
          <div class="usgs-section">
            <p class="section-label">Radford Gauge</p>
            <div id="usgs-content" class="content-block"></div>
          </div>
        </article>
      </section>

      <section class="card solunar-section" id="solunar-card">
        <div class="card-title-row">
          <div>
            <h2>Solunar</h2>
          </div>
          <p id="solunar-meta" class="card-meta">7 days | ET</p>
        </div>
        <div id="solunar-content" class="content-block"></div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
